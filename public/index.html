<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guará Pizzaria — Peça pelo chat</title>
<meta name="description" content="Peça sua pizza na Guará Pizzaria conversando pelo chat.">
<meta name="theme-color" content="#EFF5FB">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ceu:#EFF5FB;
  --espuma:#FFFFFF;
  --raso:#DCEAF7;
  --onda:#2E6FB7;
  --onda-escura:#245C9B;
  --tinta:#12263C;
  --maresia:#4F6C88;
  --guara:#CC3722;
  --papel:#FDF7EA;
  --papel-linha:#E2A33C;
  --contorno:rgba(18,38,60,.11);

  --display:"Unbounded",system-ui,sans-serif;
  --corpo:"Inter Tight",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  overflow:hidden;
  margin:0;
  font-family:var(--corpo);
  color:var(--tinta);
  background:var(--ceu);
  -webkit-font-smoothing:antialiased;
}

/* água rasa: o azul se adensa na base da tela */
.mar{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(115% 62% at 50% 116%, rgba(46,111,183,.20) 0%, rgba(46,111,183,.07) 46%, transparent 74%),
    linear-gradient(180deg,#F6FAFD 0%,#EFF5FB 48%,#E2EDF8 100%);
}
.mar::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:40%;
  background:repeating-linear-gradient(180deg,rgba(46,111,183,.05) 0 1px,transparent 1px 10px);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000);
  mask-image:linear-gradient(180deg,transparent,#000);
}

.app{
  position:relative;z-index:1;
  max-width:780px;margin:0 auto;
  height:100vh;height:100dvh;   /* altura fixa: sem isso o filho nunca rola */
  display:flex;flex-direction:column;
}

/* ---------- cabeçalho ---------- */
.topo{
  flex-shrink:0;
  display:flex;align-items:center;gap:12px;
  padding:14px 20px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--contorno);
}
.marca-guara{width:29px;height:29px;flex-shrink:0}
.marca{display:flex;flex-direction:column;gap:3px;min-width:0}
.marca strong{
  font-family:var(--display);font-weight:800;
  font-size:1rem;letter-spacing:-.045em;line-height:1;
}
.marca span{
  font-size:.65rem;letter-spacing:.13em;text-transform:uppercase;color:var(--maresia);
}
.topo-acoes{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}

.btn{
  font-family:var(--corpo);font-size:.79rem;font-weight:600;
  padding:9px 15px;border-radius:999px;
  border:1px solid transparent;background:transparent;color:inherit;
  cursor:pointer;transition:background .16s,border-color .16s,color .16s;
}
.btn:focus-visible{outline:2px solid var(--onda);outline-offset:2px}
.btn-fantasma{border-color:var(--contorno);color:var(--tinta)}
.btn-fantasma:hover{background:var(--raso);border-color:transparent}
.btn-solido{background:var(--guara);color:#fff}
.btn-solido:hover{background:#B22D1B}
.btn-solido:disabled{background:#B9CBDD;color:#fff;cursor:not-allowed}
.btn-linha{border-color:var(--contorno);color:var(--tinta)}
.btn-linha:hover{background:var(--raso)}

/* botão discreto de ajustes */
.btn-icone{
  width:32px;height:32px;padding:0;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  border:1px solid transparent;background:transparent;
  color:var(--maresia);cursor:pointer;transition:background .16s,color .16s;
}
.btn-icone:hover{background:var(--raso);color:var(--onda)}
.btn-icone:focus-visible{outline:2px solid var(--onda);outline-offset:2px}
.btn-icone svg{width:16px;height:16px}
.btn-icone[aria-expanded="true"]{background:var(--raso);color:var(--onda)}

/* ---------- conexão ---------- */
.config{
  padding:18px 20px;
  background:var(--espuma);
  border-bottom:1px solid var(--contorno);
}
.config[hidden]{display:none}
.config h2{font-family:var(--display);font-weight:600;font-size:.86rem;letter-spacing:-.02em;margin:0 0 5px}
.config p{margin:0 0 14px;font-size:.82rem;color:var(--maresia);line-height:1.55}
.campo{display:block;margin-bottom:12px}
.campo span{
  display:block;font-size:.65rem;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--maresia);margin-bottom:6px;
}
.campo input{
  width:100%;padding:11px 13px;
  font-family:var(--mono);font-size:.8rem;
  color:var(--tinta);background:var(--ceu);
  border:1px solid var(--contorno);border-radius:10px;
}
.campo input::placeholder{color:#9DB4CA}
.campo input:focus{outline:2px solid var(--onda);outline-offset:-1px;border-color:transparent}
.config-acoes{display:flex;gap:8px;flex-wrap:wrap}
.aviso{font-size:.79rem;margin:11px 0 0;line-height:1.5}
.aviso.ok{color:var(--onda-escura)}
.aviso.erro{color:#C0301C}
.aviso:empty{display:none}

/* ---------- conversa ---------- */
.conversa{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:26px 20px 10px;
  display:flex;flex-direction:column;gap:20px;
  scroll-behavior:smooth;
}

.vazio{margin:auto 0;padding:24px 2px}
.vazio h1{
  font-family:var(--display);font-weight:800;
  font-size:clamp(1.95rem,7.4vw,3.05rem);
  line-height:1;letter-spacing:-.055em;margin:0 0 16px;
  animation:subir .5s ease both;
}
.vazio h1 em{font-style:normal;color:var(--guara)}
.vazio p{
  margin:0 0 24px;max-width:34ch;color:var(--maresia);
  font-size:.96rem;line-height:1.6;
  animation:subir .5s .07s ease both;
}
@keyframes subir{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.atalhos{display:flex;gap:8px;flex-wrap:wrap;animation:subir .5s .14s ease both}
.atalho{
  font-family:var(--corpo);font-size:.84rem;font-weight:500;
  padding:10px 16px;border-radius:999px;
  border:1px solid var(--contorno);
  background:var(--espuma);color:var(--tinta);cursor:pointer;
  transition:border-color .16s,background .16s;
}
.atalho:hover{border-color:var(--onda);background:var(--raso)}
.atalho:focus-visible{outline:2px solid var(--onda);outline-offset:2px}

.msg{max-width:86%;display:flex;flex-direction:column;gap:6px}
.msg .quem{
  font-size:.62rem;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--maresia);
}

.msg.cliente{align-self:flex-end;align-items:flex-end}
.msg.cliente .balao{
  background:var(--onda);color:#fff;
  padding:12px 15px;border-radius:16px 16px 4px 16px;
  font-size:.94rem;line-height:1.55;
  white-space:pre-wrap;word-wrap:break-word;
}

.msg.bot{align-self:flex-start}
.msg.bot .balao{
  background:var(--espuma);
  border:1px solid var(--contorno);
  border-radius:16px 16px 16px 4px;
  padding:13px 16px;
  box-shadow:0 1px 2px rgba(18,38,60,.05);
}
.msg.bot .balao p{margin:0 0 9px;font-size:.94rem;line-height:1.6;white-space:pre-wrap}
.msg.bot .balao p:last-child{margin-bottom:0}

/* assinatura: a comanda de papel presa ao balão */
.comanda{
  font-family:var(--mono);font-size:.755rem;line-height:1.72;
  white-space:pre-wrap;word-wrap:break-word;
  margin:13px 0 0;padding:14px 15px;
  color:#3E3222;
  background:var(--papel);
  border:1px solid rgba(226,163,60,.32);
  border-left:3px solid var(--papel-linha);
  border-radius:10px;overflow-x:auto;
}
.msg.bot.fechado .comanda{border-left-color:var(--guara);border-color:rgba(204,55,34,.34)}

.selo{
  display:inline-flex;align-items:center;gap:7px;margin-top:13px;
  font-family:var(--display);font-weight:600;font-size:.68rem;
  letter-spacing:.1em;text-transform:uppercase;color:#fff;
  background:var(--guara);border-radius:999px;padding:7px 14px;
  animation:selar .34s cubic-bezier(.2,1.4,.4,1) both;
}
.selo svg{width:13px;height:13px}
@keyframes selar{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}

.msg.falha .balao{border-color:rgba(204,55,34,.42);background:#FFF4F2}

.pontos{display:inline-flex;gap:5px;padding:3px 0}
.pontos i{width:6px;height:6px;border-radius:50%;background:#A9C0D6;animation:pulsar 1.1s infinite}
.pontos i:nth-child(2){animation-delay:.16s}
.pontos i:nth-child(3){animation-delay:.32s}
@keyframes pulsar{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

/* ---------- escrever ---------- */
.compositor{
  flex-shrink:0;
  display:flex;gap:9px;align-items:flex-end;
  padding:13px 20px calc(13px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--contorno);
}
.compositor textarea{
  flex:1;resize:none;
  font-family:var(--corpo);font-size:.95rem;line-height:1.5;
  padding:12px 15px;max-height:136px;
  color:var(--tinta);background:var(--ceu);
  border:1px solid var(--contorno);border-radius:16px;
}
.compositor textarea::placeholder{color:#9DB4CA}
.compositor textarea:focus{outline:2px solid var(--onda);outline-offset:-1px}
.compositor .btn-solido{padding:13px 22px;flex-shrink:0}

@media (max-width:520px){
  .msg{max-width:93%}
  .topo,.compositor{padding-left:15px;padding-right:15px}
  .conversa{padding:20px 15px 10px}
  .config{padding:16px 15px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .conversa{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="mar" aria-hidden="true"></div>

<div class="app">

  <header class="topo">
    <svg class="marca-guara" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M4 21c5.4.6 9-1.4 11.2-4.7 1.7-2.6 2.3-5.6 5-7.3 2.4-1.5 5.2-1 6.6.6" stroke="#D8412C" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M15.2 16.3c-.4 3.6.9 6.6 3.6 8.9" stroke="#D8412C" stroke-width="2.1" stroke-linecap="round"/>
      <circle cx="25.4" cy="8.4" r="1.5" fill="#E2A33C"/>
    </svg>
    <div class="marca">
      <strong>Guará Pizzaria</strong>
      <span id="statusSessao">Pedidos pelo chat</span>
    </div>
    <div class="topo-acoes">
      <button class="btn btn-fantasma" id="btnNovo" type="button">Novo pedido</button>
      <button class="btn-icone" id="btnConfig" type="button" aria-expanded="false" aria-controls="config" title="Ajustes" aria-label="Ajustes de conexão">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 2.4v2M10 15.6v2M17.6 10h-2M4.4 10h-2M15.4 4.6l-1.4 1.4M6 14l-1.4 1.4M15.4 15.4L14 14M6 6L4.6 4.6"
                stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="config" id="config" hidden>
    <h2>Ajustes de conexão</h2>
    <p>O chat já vem configurado. Só mexa aqui se o endereço do atendimento mudar.</p>
    <label class="campo">
      <span>URL do webhook</span>
      <input id="inputUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://SEU-ESPACO.app.n8n.cloud/webhook/guara-pizzaria">
    </label>
    <div class="config-acoes">
      <button class="btn btn-solido" id="btnSalvar" type="button">Salvar</button>
      <button class="btn btn-linha" id="btnTestar" type="button">Testar conexão</button>
      <button class="btn btn-linha" id="btnRestaurar" type="button">Restaurar padrão</button>
    </div>
    <p class="aviso" id="avisoConfig" role="status"></p>
  </section>

  <main class="conversa" id="conversa" aria-live="polite" aria-label="Conversa com o atendimento"></main>

  <div class="compositor">
    <label for="entrada" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Sua mensagem</label>
    <textarea id="entrada" rows="1" placeholder="Escreva sua mensagem…"></textarea>
    <button class="btn btn-solido" id="btnEnviar" type="button">Enviar</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  // Endereço de produção do agente. Serve para todo mundo que abrir a página;
  // os ajustes só existem para trocar isso pontualmente neste navegador.
  var URL_PADRAO = "https://jacsonbordin.app.n8n.cloud/webhook/guara-pizzaria";

  var CHAVE_URL = "guara.webhookUrl";
  var CHAVE_SESSAO = "guara.sessionId";

  var el = {
    conversa: document.getElementById("conversa"),
    entrada: document.getElementById("entrada"),
    enviar: document.getElementById("btnEnviar"),
    config: document.getElementById("config"),
    btnConfig: document.getElementById("btnConfig"),
    inputUrl: document.getElementById("inputUrl"),
    salvar: document.getElementById("btnSalvar"),
    testar: document.getElementById("btnTestar"),
    restaurar: document.getElementById("btnRestaurar"),
    aviso: document.getElementById("avisoConfig"),
    novo: document.getElementById("btnNovo"),
    status: document.getElementById("statusSessao")
  };

  function ler(c){ try { return window.localStorage.getItem(c); } catch(e){ return null; } }
  function gravar(c, v){ try { window.localStorage.setItem(c, v); } catch(e){} }
  function apagar(c){ try { window.localStorage.removeItem(c); } catch(e){} }

  function novaSessao(){
    var id = "web-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
    gravar(CHAVE_SESSAO, id);
    return id;
  }

  var webhookUrl = ler(CHAVE_URL) || URL_PADRAO;
  var sessionId = ler(CHAVE_SESSAO) || novaSessao();
  var enviando = false;

  var INICIO_BLOCO = /^(CARDÁPIO|RESUMO DO PEDIDO)/m;

  function separarBlocos(texto){
    var m = texto.match(INICIO_BLOCO);
    if(!m) return { prosa: texto.trim(), bloco: "" };
    var corte = texto.indexOf(m[0]);
    return { prosa: texto.slice(0, corte).trim(), bloco: texto.slice(corte).trim() };
  }

  function limparVazio(){
    var v = el.conversa.querySelector(".vazio");
    if(v) v.remove();
  }

  function msgCliente(texto){
    limparVazio();
    var wrap = document.createElement("div");
    wrap.className = "msg cliente";
    var quem = document.createElement("div");
    quem.className = "quem";
    quem.textContent = "Você";
    var balao = document.createElement("div");
    balao.className = "balao";
    balao.textContent = texto;
    wrap.appendChild(quem);
    wrap.appendChild(balao);
    el.conversa.appendChild(wrap);
    rolar();
  }

  function msgBot(texto, opcoes){
    opcoes = opcoes || {};
    limparVazio();
    var wrap = document.createElement("div");
    wrap.className = "msg bot" + (opcoes.fechado ? " fechado" : "") + (opcoes.falha ? " falha" : "");

    var quem = document.createElement("div");
    quem.className = "quem";
    quem.textContent = opcoes.falha ? "Não enviado" : "Guará";

    var balao = document.createElement("div");
    balao.className = "balao";

    var partes = separarBlocos(texto);
    if(partes.prosa){
      partes.prosa.split(/\n{2,}/).forEach(function(p){
        var par = document.createElement("p");
        par.textContent = p;
        balao.appendChild(par);
      });
    }
    if(partes.bloco){
      var pre = document.createElement("pre");
      pre.className = "comanda";
      pre.textContent = partes.bloco;
      balao.appendChild(pre);
    }
    if(opcoes.fechado){
      var selo = document.createElement("div");
      selo.className = "selo";
      selo.innerHTML = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
        '<path d="M2.5 8.5l3.5 3.5 7.5-8" stroke="currentColor" stroke-width="2.4" ' +
        'stroke-linecap="round" stroke-linejoin="round"/></svg><span>Pedido confirmado</span>';
      balao.appendChild(selo);
    }

    wrap.appendChild(quem);
    wrap.appendChild(balao);
    el.conversa.appendChild(wrap);
    rolar();
    return wrap;
  }

  function digitando(){
    var wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.innerHTML = '<div class="quem">Guará</div><div class="balao">' +
      '<div class="pontos" aria-label="Escrevendo"><i></i><i></i><i></i></div></div>';
    el.conversa.appendChild(wrap);
    rolar();
    return wrap;
  }

  // O bloco monoespaçado do cardápio muda de altura depois de inserido.
  // Dois quadros garantem medir o scrollHeight já com o layout final.
  function rolar(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        el.conversa.scrollTop = el.conversa.scrollHeight;
      });
    });
  }

  function telaInicial(){
    el.conversa.innerHTML =
      '<div class="vazio">' +
        '<h1>Boa noite.<br>O forno já<br>está <em>quente</em>.</h1>' +
        '<p>Monte sua pizza conversando por aqui. Eu mostro o cardápio, fecho o pedido e mando pra cozinha.</p>' +
        '<div class="atalhos">' +
          '<button class="atalho" type="button" data-frase="Me mostra o cardápio">Ver o cardápio</button>' +
          '<button class="atalho" type="button" data-frase="Quero fazer um pedido">Fazer um pedido</button>' +
          '<button class="atalho" type="button" data-frase="Quero consultar meu pedido">Consultar pedido</button>' +
          '<button class="atalho" type="button" data-frase="Vocês estão abertos agora?">Estão abertos?</button>' +
        '</div>' +
      '</div>';
  }

  el.conversa.addEventListener("click", function(ev){
    var alvo = ev.target.closest(".atalho");
    if(!alvo) return;
    el.entrada.value = alvo.getAttribute("data-frase");
    enviar();
  });

  function alternarConfig(forcar){
    var abrir = typeof forcar === "boolean" ? forcar : el.config.hidden;
    el.config.hidden = !abrir;
    el.btnConfig.setAttribute("aria-expanded", String(abrir));
    rolar();
    if(abrir){
      el.inputUrl.value = webhookUrl;
      el.inputUrl.focus();
    }
  }

  function mostrarAviso(texto, tipo){
    el.aviso.textContent = texto;
    el.aviso.className = "aviso " + (tipo || "");
  }

  function urlValida(v){
    try { var u = new URL(v); return u.protocol === "http:" || u.protocol === "https:"; }
    catch(e){ return false; }
  }

  el.btnConfig.addEventListener("click", function(){ alternarConfig(); });

  el.salvar.addEventListener("click", function(){
    var valor = el.inputUrl.value.trim();
    if(!urlValida(valor)){
      mostrarAviso("Esse endereço não é uma URL válida. Ela começa com https:// e termina no caminho do webhook.", "erro");
      return;
    }
    webhookUrl = valor;
    gravar(CHAVE_URL, valor);
    mostrarAviso("Endereço salvo neste navegador.", "ok");
  });

  el.restaurar.addEventListener("click", function(){
    apagar(CHAVE_URL);
    webhookUrl = URL_PADRAO;
    el.inputUrl.value = URL_PADRAO;
    mostrarAviso("Endereço padrão restaurado.", "ok");
  });

  el.testar.addEventListener("click", function(){
    var valor = el.inputUrl.value.trim() || webhookUrl;
    if(!urlValida(valor)){
      mostrarAviso("Informe a URL do webhook antes de testar.", "erro");
      return;
    }
    mostrarAviso("Testando…", "");
    el.testar.disabled = true;
    chamar(valor, "teste de conexão").then(function(){
      mostrarAviso("Conexão funcionando. O fluxo respondeu.", "ok");
    }).catch(function(erro){
      mostrarAviso(erro.message, "erro");
    }).then(function(){
      el.testar.disabled = false;
    });
  });

  el.novo.addEventListener("click", function(){
    sessionId = novaSessao();
    telaInicial();
    el.entrada.focus();
  });

  function chamar(url, mensagem){
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: sessionId, mensagem: mensagem })
    }).then(function(r){
      if(!r.ok){
        if(r.status === 404){
          throw new Error("O n8n respondeu 404. Ative o fluxo e confira se está usando a URL de produção (/webhook/), não a de teste (/webhook-test/).");
        }
        throw new Error("O n8n respondeu com erro " + r.status + ". Confira a execução do fluxo no painel.");
      }
      return r.json();
    }).catch(function(erro){
      if(erro instanceof TypeError){
        throw new Error("Não consegui alcançar o atendimento. Verifique a URL nos ajustes e libere este site no campo Allowed Origins (CORS) do nó Webhook.");
      }
      throw erro;
    });
  }

  function enviar(){
    if(enviando) return;
    var texto = el.entrada.value.trim();
    if(!texto) return;

    msgCliente(texto);
    el.entrada.value = "";
    el.entrada.style.height = "auto";
    enviando = true;
    el.enviar.disabled = true;
    var espera = digitando();

    chamar(webhookUrl, texto).then(function(dados){
      espera.remove();
      var resposta = (dados && typeof dados.resposta === "string" && dados.resposta.trim())
        ? dados.resposta
        : "O atendimento respondeu, mas sem texto. Confira o nó Responder no n8n.";
      msgBot(resposta, { fechado: !!(dados && dados.pedido_completo) });
      if(dados && dados.pedido_completo) sessionId = novaSessao();
    }).catch(function(erro){
      espera.remove();
      msgBot(erro.message, { falha: true });
    }).then(function(){
      enviando = false;
      el.enviar.disabled = false;
      el.entrada.focus();
    });
  }

  el.enviar.addEventListener("click", enviar);

  el.entrada.addEventListener("keydown", function(ev){
    if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); enviar(); }
  });

  el.entrada.addEventListener("input", function(){
    el.entrada.style.height = "auto";
    el.entrada.style.height = Math.min(el.entrada.scrollHeight, 136) + "px";
    rolar();
  });

  el.inputUrl.value = webhookUrl;
  telaInicial();
})();
</script>
</body>
</html>
