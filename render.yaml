services:
  - type: web
    name: pizzaria-do-jacson
    runtime: static
    staticPublishPath: ./public
    buildCommand: ""
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
